project:
  type: default
  output-dir: _output
  render:
    - index.qmd
    - definitional-models.qmd
    # Prediction models are intentionally kept in the repository but are
    # temporarily excluded from the public site. Re-enable when needed:
    # - prediction-models.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    toc-depth: 2
    toc-title: "Contents"
    embed-resources: true
    self-contained-math: true
    anchor-sections: false
    smooth-scroll: true
    page-layout: article
    include-after-body: zoom-lightbox.html
