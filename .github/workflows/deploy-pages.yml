name: Build and deploy AQUA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render tree graphics
        run: |
          mkdir -p figures
          dot -Tsvg trees/solution-tree.dot -o figures/solution-tree.svg
          dot -Tsvg trees/employment-tree.dot -o figures/employment-tree.svg
          dot -Tsvg trees/authenticator-tree.dot -o figures/authenticator-tree.svg

      - name: Fix tree branches
        run: |
          node fix-tree-branches.js \
            figures/solution-tree.svg \
            figures/employment-tree.svg \
            figures/authenticator-tree.svg

      - name: Render Quarto project
        run: |
          quarto render index.qmd --to html

      - name: Make standalone HTML
        run: |
          node make-standalone.js "_output/authentication-quality-models.html"

      - name: Prepare final HTML
        run: |
          mv "_output/authentication-quality-models.html" "_output/a-quality-model-for-authentication-solutions.html"
          mkdir -p public
          cp "_output/a-quality-model-for-authentication-solutions.html" "public/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4